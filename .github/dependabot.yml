version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # A bundled package (yaml, Tiptap, Geist) also needs `pnpm vendor`; CI fails until it is run.
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # Node's typings follow the Node major the project runs (24, as in CI); a newer major would
      # type APIs that Node 24 lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
