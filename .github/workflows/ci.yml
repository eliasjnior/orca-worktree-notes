name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The ruleset on main requires this job by name.
    name: Lint, typecheck and vendor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Orca's directory refuses tags whose plugins bundle binaries other than images.
      - run: pnpm binaries
      # No Orca on CI: the typings come from the Orca repository at config.orcaVersion.
      - run: pnpm types
      - run: pnpm typecheck
      # Plugins ship these bundles; they must be what the lockfile's packages build.
      - name: Vendored bundles match the lockfile
        run: |
          pnpm vendor
          git diff --exit-code -- plugins/*/vendor
